[workspace]
members = ["python"]

[workspace.package]
version = "0.1.4"
edition = "2021"
license = "MIT"

[package]
name = "fast-uuid-v7"
version.workspace = true
edition.workspace = true
description = "A high-performance Rust library for generating UUID v7 compatible identifiers."
repository = "https://github.com/marcomq/fast-uuid-v7"
license.workspace = true

[dependencies]
rand = "0.9"

[[bench]]
name = "benchmark"
harness = false

[dev-dependencies]
criterion = "0.8"
uuid = { version = "1", features = ["v7"] }

# Performance optimizations for release builds
[profile.release]
# Enable Link-Time Optimization for maximum performance
lto = true
# Use a single codegen unit for better optimization (slower compile, faster runtime)
codegen-units = 1
# Strip symbols to reduce binary size
strip = true
# Optimize for speed
opt-level = 3
