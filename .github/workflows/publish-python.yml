name: Publish Python Package

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      target:
        description: "Where to publish the package"
        required: true
        default: "testpypi"
        type: choice
        options:
          - testpypi
          - pypi

jobs:
  build-wheels:
    name: Build wheels on ${{ matrix.platform.os }} (${{ matrix.platform.target }})
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          # Linux x86_64
          - runner: ubuntu-latest
            os: linux
            target: x86_64
          # Linux aarch64 (ARM64)
          - runner: ubuntu-latest
            os: linux
            target: aarch64
          # Linux armv7
          - runner: ubuntu-latest
            os: linux
            target: armv7
          # macOS x86_64 (Intel)
          - runner: macos-15-intel
            os: macos
            target: x86_64
          # macOS aarch64 (Apple Silicon)
          - runner: macos-latest
            os: macos
            target: aarch64
          # Windows x86_64
          - runner: windows-latest
            os: windows
            target: x86_64
          # Windows aarch64 (ARM64) - Disabled due to lack of Python dev libraries in CI
          # Cross-compiling Python extensions for Windows ARM64 is not currently supported
          # - runner: windows-latest
          #   os: windows
          #   target: aarch64
    
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          sccache: 'true'
          manylinux: auto

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform.os }}-${{ matrix.platform.target }}
          path: python/dist

  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          command: sdist
          args: --out dist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: python/dist

  publish:
    name: Publish to ${{ github.event_name == 'release' && 'PyPI' || inputs.target }}
    runs-on: ubuntu-latest
    needs: [build-wheels, build-sdist]
    permissions:
      contents: read
      id-token: write
    environment:
      name: ${{ github.event_name == 'release' && 'pypi' || inputs.target }}

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List distribution files
        run: ls -lh dist/

      - name: Check package metadata
        run: |
          pip install twine
          twine check dist/*

      - name: Publish to TestPyPI
        if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/

      - name: Publish to PyPI
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

