name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  SUB_MS_DIAGNOSTIC_SAMPLES: "5000"

jobs:
  test:
    name: Test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
    - name: Run bench
      run: cargo bench

  test-fallback:
    name: Test Fallback (i686)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-multilib
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: i686-unknown-linux-gnu
    - name: Build
      run: cargo build --verbose --target i686-unknown-linux-gnu
    - name: Run tests
      run: cargo test --verbose --target i686-unknown-linux-gnu
    - name: Run bench
      run: cargo bench

  sub-ms-diagnostic:
    name: Sub-ms Diagnostic ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        persist-credentials: false
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
      with:
        toolchain: stable
    - name: Run sub-ms diagnostic
      shell: bash
      run: |
        mkdir -p diagnostics
        cargo run --example sub_ms_diagnostic -- "${SUB_MS_DIAGNOSTIC_SAMPLES}" | tee "diagnostics/sub-ms-${{ matrix.os }}.txt"
    - name: Add diagnostic summary
      shell: bash
      run: |
        {
          echo "## Sub-ms Diagnostic (${{ matrix.os }})"
          echo
          echo '```text'
          cat "diagnostics/sub-ms-${{ matrix.os }}.txt"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
    - name: Upload diagnostic artifact
      uses: actions/upload-artifact@v4
      with:
        name: sub-ms-diagnostic-${{ matrix.os }}
        path: diagnostics/sub-ms-${{ matrix.os }}.txt
