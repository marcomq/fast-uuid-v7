name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  SUB_MS_DIAGNOSTIC_SAMPLES: "5000"

jobs:
  test:
    name: Test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
    - name: Run bench
      run: cargo bench

  test-fallback:
    name: Test Fallback (i686)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-multilib
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: i686-unknown-linux-gnu
    - name: Build
      run: cargo build --verbose --target i686-unknown-linux-gnu
    - name: Run tests
      run: cargo test --verbose --target i686-unknown-linux-gnu
    - name: Run bench
      run: cargo bench

  python-freethreaded:
    name: Python free-threaded smoke test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Set up free-threaded Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.14t"
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
    - name: Build free-threaded wheel
      uses: PyO3/maturin-action@v1
      with:
        working-directory: python
        args: --release --out dist --interpreter python3.14t
        sccache: 'true'
        # Build natively against the host free-threaded interpreter rather than
        # inside a manylinux container (which ships only GIL-enabled Pythons).
        container: 'off'
    - name: Install and smoke test (GIL disabled)
      shell: bash
      run: |
        python3.14t -m pip install --upgrade pip
        python3.14t -m pip install python/dist/*.whl
        python3.14t - <<'PY'
        import sys, threading, fastuuidv7

        # Proves the module runs GIL-free: it must NOT force the GIL back on.
        # (Re-adding `gil_used = true` to the pymodule would fail here.)
        assert not sys._is_gil_enabled(), "GIL is enabled — module forced it on"

        # Parallel generation: each thread has its own generator state, so this
        # must scale without a lock and never collide (74 random bits per id).
        out = []
        def work():
            out.append([fastuuidv7.gen_id_str() for _ in range(10_000)])
        threads = [threading.Thread(target=work) for _ in range(8)]
        for t in threads:
            t.start()
        for t in threads:
            t.join()
        ids = [u for chunk in out for u in chunk]
        assert len(ids) == 80_000
        assert len(set(ids)) == len(ids), "duplicate ids generated across threads"

        # Exercise the UUID-object path (fresh-alloc under free-threading).
        assert str(fastuuidv7.uuid7())

        print("gil_enabled:", sys._is_gil_enabled())
        print("generated:", len(ids), "unique:", len(set(ids)))
        PY

  sub-ms-diagnostic:
    name: Sub-ms Diagnostic ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        persist-credentials: false
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
      with:
        toolchain: stable
    - name: Run sub-ms diagnostic
      shell: bash
      run: |
        mkdir -p diagnostics
        cargo run --example sub_ms_diagnostic -- "${SUB_MS_DIAGNOSTIC_SAMPLES}" | tee "diagnostics/sub-ms-${{ matrix.os }}.txt"
    - name: Add diagnostic summary
      shell: bash
      run: |
        {
          echo "## Sub-ms Diagnostic (${{ matrix.os }})"
          echo
          echo '```text'
          cat "diagnostics/sub-ms-${{ matrix.os }}.txt"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
    - name: Upload diagnostic artifact
      uses: actions/upload-artifact@v4
      with:
        name: sub-ms-diagnostic-${{ matrix.os }}
        path: diagnostics/sub-ms-${{ matrix.os }}.txt
