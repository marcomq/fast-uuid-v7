name: Node

on:
  push:
    branches: [ "main", "master", "dev" ]
    paths:
      - ".github/workflows/node.yml"
      - "node/**"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - ".github/workflows/node.yml"
      - "node/**"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: node/package-lock.json

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Check version sync
        run: node sync-version.mjs --check

      - name: Install Node dependencies
        run: npm ci

      - name: Build native addon
        run: npm run build

      - name: Test (Node)
        run: npm test

      - name: Test (Deno)
        run: deno test --no-check --allow-read --allow-ffi --allow-env test/

      - name: Test (Bun)
        run: bun test test/
